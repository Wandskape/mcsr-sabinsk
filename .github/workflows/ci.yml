name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:validate
      - run: pnpm audit:dependencies

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mcsr_sabinsk
          POSTGRES_USER: mcsr
          POSTGRES_PASSWORD: mcsr_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcsr -d mcsr_sabinsk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:4321
      PUBLIC_API_BASE_URL: http://127.0.0.1:3000/api/v1
      DATABASE_URL: postgresql://mcsr:mcsr_e2e_password@127.0.0.1:5432/mcsr_sabinsk
      SESSION_SECRET: e2e-session-secret-at-least-32-characters
      CSRF_SECRET: e2e-csrf-secret-at-least-32-charactersxx
      SESSION_COOKIE_NAME: mcsr_e2e_session
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: mcsr-sabinsk-e2e
      S3_ACCESS_KEY: mcsr
      S3_SECRET_KEY: mcsr_e2e_password
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/mcsr-sabinsk-e2e
      S3_ALLOW_PUBLIC_READ: "true"
      RANKED_API_BASE_URL: https://api.mcsrranked.com
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-admin-password-long
      SEED_DEMO: "true"
      E2E_BASE_URL: http://localhost:4321
      E2E_API_BASE_URL: http://127.0.0.1:3000/api/v1
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password-long
      E2E_ALLOW_MUTATIONS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @mcsr-sabinsk/backend prisma:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
